{% set version = "1.12.0" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-rhino
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/rhino_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/rhino/rhino_{{ version }}.tar.gz
  sha256: 986bcb4a3188d6352ae2e7cbd5587b47e141656db0335ed7cbb130e95a898bf3

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip             # [win]
    - cross-r-base {{ r_base }}  # [build_platform != target_platform]
  host:
    - r-base
    - r-box >=1.1.3
    - r-box.linters >=0.10.5
    - r-box.lsp
    - r-callr
    - r-cli
    - r-config
    - r-covr >=3.6.5
    - r-fs
    - r-glue
    - r-lintr >=3.0.0
    - r-logger
    - r-purrr
    - r-renv
    - r-rstudioapi
    - r-sass
    - r-shiny
    - r-styler
    - r-testthat >=3.0.0
    - r-withr
    - r-yaml
  run:
    - r-base
    - r-box >=1.1.3
    - r-box.linters >=0.10.5
    - r-box.lsp
    - r-callr
    - r-cli
    - r-config
    - r-covr >=3.6.5
    - r-fs
    - r-glue
    - r-lintr >=3.0.0
    - r-logger
    - r-purrr
    - r-renv
    - r-rstudioapi
    - r-sass
    - r-shiny
    - r-styler
    - r-testthat >=3.0.0
    - r-withr
    - r-yaml

test:
  commands:
    - $R -e "library('rhino')"           # [not win]
    - "\"%R%\" -e \"library('rhino')\""  # [win]

about:
  home: https://appsilon.github.io/rhino/
  dev_url: https://github.com/Appsilon/rhino
  license: LGPL-3.0-only
  summary: A framework that supports creating and extending enterprise Shiny applications using best practices.
  license_family: LGPL
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/LGPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
